name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          apps/extension/dist/playlist-transfer-extension-*-chromium-guided.zip
          apps/extension/dist/SHA256SUMS
          --verify-tag
          --title "Playlist-Transfer $GITHUB_REF_NAME"
          --generate-notes
